services:
  web:
    build: .
    image: lomba-web-dev-game:latest
    container_name: lomba-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 1999
      HOSTNAME: 0.0.0.0
    # RAM 4GB dibagi OS + lain-lain: batasi Next.js ~1.5GB
    mem_limit: 1.5g
    mem_reservation: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:1999/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - webnet

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
